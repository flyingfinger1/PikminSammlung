<!-- fonts (Figtree, Bricolage Grotesque; SIL OFL, web/fonts/) are embedded by build_page.py: no request leaves the page -->
<style>/*FONTS*/</style>
<style>
:root {
  --ground: #F2F5EE;
  --surface: #FFFFFF;
  --surface-2: #E8EEE5;
  --ink: #1D2B21;
  --muted: #5E6E62;
  --line: #D6DFD3;
  --accent: #2E8B57;
  --accent-ink: #FFFFFF;
  --bloom: #E8547A;
  --gold: #E9A92B;
  --heart-empty: #D9DDD8;
  --wash: 0.16;

  --c-rot: #E5484D;
  --c-gelb: #F2C230;
  --c-blau: #3E7BE0;
  --c-lila: #8A4FD0;
  --c-weiss: #CFC8DF;
  --c-fels: #6B6F76;
  --c-fluegel: #F08DB5;
  --c-eis: #5EC6DA;

  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111913;
    --surface: #1A241D;
    --surface-2: #233027;
    --ink: #E6EEE7;
    --muted: #9CAFA1;
    --line: #2E3C32;
    --accent: #5CC98A;
    --accent-ink: #0E1A12;
    --bloom: #F27897;
    --gold: #F1BC4E;
    --heart-empty: #3A463D;
    --wash: 0.22;
  }
}
:root[data-theme="dark"] {
  --ground: #111913;
  --surface: #1A241D;
  --surface-2: #233027;
  --ink: #E6EEE7;
  --muted: #9CAFA1;
  --line: #2E3C32;
  --accent: #5CC98A;
  --accent-ink: #0E1A12;
  --bloom: #F27897;
  --gold: #F1BC4E;
  --heart-empty: #3A463D;
  --wash: 0.22;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-inline: clamp(16px, 4vw, 48px);
}
.wrap { max-width: 1320px; margin-inline: auto; padding-block: 36px 64px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- masthead ---------- */
.mast { display: grid; gap: 22px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 {
  font-family: var(--display); font-weight: 800; letter-spacing: -.02em;
  font-size: clamp(38px, 6vw, 68px); line-height: .95; margin: 0; text-wrap: balance;
}
.count { display: flex; align-items: baseline; gap: 10px; }
.count b { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 6vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.count span { color: var(--muted); max-width: 17ch; line-height: 1.3; }

.spectrum { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: var(--surface-2); }
.spectrum button { border: 0; padding: 0; cursor: pointer; min-width: 3px; transition: filter .15s; }
.spectrum button:hover { filter: brightness(1.08) saturate(1.1); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.stats { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 0; }
.stats div { display: grid; }
.stats dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--display); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note strong { color: var(--bloom); font-weight: 600; }

/* ---------- toolbar ---------- */
.bar {
  position: sticky; top: 0; z-index: 5;
  margin: 28px calc(-1 * clamp(16px, 4vw, 48px)) 22px;
  padding: 12px clamp(16px, 4vw, 48px);
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar-inner { max-width: 1320px; margin-inline: auto; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.search { flex: 1 1 200px; min-width: 0; }
.search input, .bar select {
  width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 0 12px;
}
.bar select { width: auto; padding-right: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px 0 8px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500;
}
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex: none; }
.fav-toggle[aria-pressed="true"] { border-color: var(--bloom); box-shadow: inset 0 0 0 1px var(--bloom); color: var(--bloom); }
.shown { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reset { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0 4px; }

/* ---------- specimen grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr;
}
.portrait {
  position: relative; aspect-ratio: 160 / 134;
  /* stays light in both themes: the white screenshot multiplies onto it */
  background: color-mix(in srgb, var(--c) 17%, #F7F9F5);
}
.portrait i {
  position: absolute; inset: 0; background-image: url("thumbs.jpg"); background-repeat: no-repeat;
  mix-blend-mode: multiply;
}
.rank { position: absolute; left: 8px; top: 7px; font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums;
  background: var(--surface); border-radius: 6px; padding: 1px 6px; }
.star { position: absolute; right: 8px; top: 6px; color: var(--gold); font-size: 17px; line-height: 1; }
.body { padding: 11px 13px 13px; display: grid; gap: 8px; align-content: start; }
.name { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.15; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface-2); }
.tag.decor { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); }
.tag.plain { color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.hearts { display: inline-flex; gap: 2px; }
.hearts svg { width: 14px; height: 14px; display: block; }
.steps { font-weight: 600; font-variant-numeric: tabular-nums; }
.where { font-size: 12px; color: var(--muted); line-height: 1.35; display: grid; gap: 1px; }
.where span:first-child { overflow-wrap: anywhere; }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

/* ---------- decor matrix ---------- */
.matrix-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.matrix { border-collapse: collapse; width: 100%; min-width: 720px; font-variant-numeric: tabular-nums; }
.matrix th, .matrix td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
.matrix thead th { position: sticky; top: 0; background: var(--surface); padding: 12px 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.matrix thead th .dot { margin: 0 auto 5px; width: 14px; height: 14px; }
.matrix tbody th { text-align: left; padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.rare-badge {
  display: inline-block; margin-left: 7px; font-size: 11px; font-weight: 700; line-height: 16px;
  padding: 0 6px; border-radius: 999px; vertical-align: 2px; letter-spacing: .02em;
}
.rare-badge.rare { background: color-mix(in srgb, var(--gold) 30%, var(--surface)); color: var(--ink); }
.rare-badge.has { color: var(--gold); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 65%, var(--surface)); }
.matrix tbody tr.rare th[scope="row"] { box-shadow: inset 4px 0 0 var(--gold); background: color-mix(in srgb, var(--gold) 9%, var(--surface)); }
.matrix tbody tr.has-rare th[scope="row"] { box-shadow: inset 4px 0 0 color-mix(in srgb, var(--gold) 45%, var(--surface)); }
/* ---------- Pilzkampf ---------- */
body[data-view="pilze"] .bar .search, body[data-view="pilze"] #decor, body[data-view="pilze"] #sort,
body[data-view="pilze"] #fav, body[data-view="pilze"] #colors, body[data-view="pilze"] #shown,
body[data-view="keime"] .bar .search, body[data-view="keime"] #decor, body[data-view="keime"] #sort,
body[data-view="keime"] #fav, body[data-view="keime"] #colors, body[data-view="keime"] #shown { display: none; }
/* ---------- Keime ---------- */
.seed-group h3 { font-family: var(--display); font-size: 20px; margin: 22px 2px 10px; }
.seed-group h3 small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); }
.seed-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.seed-list li {
  display: grid; grid-template-columns: 14px 1fr auto; gap: 3px 10px; align-items: baseline;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.seed-list li.special { box-shadow: inset 4px 0 0 var(--gold); }
.seed-list .dot { align-self: center; }
.seed-name { font-weight: 600; font-size: 14px; line-height: 1.3; min-width: 0; }
.seed-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.seed-grow { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.seed-why { grid-column: 2 / -1; font-size: 13px; }
.seed-why.hatch { color: var(--accent); font-weight: 600; }
.seed-why.maybe { color: var(--ink); }
.seed-why.wait, .seed-why.planted { color: var(--muted); }
.pilze-intro { margin: 0 2px 14px; color: var(--muted); max-width: 70ch; }
.event-cfg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; }
.event-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.event-head span { color: var(--muted); font-size: 13px; }
.event-cfg p { margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.event-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ev-chip { height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; }
.ev-chip.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ev-chip.secondary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); font-weight: 600; }
b.ev { font-weight: 700; padding: 0 5px; border-radius: 6px; }
b.ev.primary { background: var(--accent); color: var(--accent-ink); }
b.ev.secondary { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pilze { min-width: 680px; }
.pilze th[scope="row"] .dot { display: inline-block; margin-right: 8px; vertical-align: -1px; }
.pilze td button.pow {
  width: calc(100% - 10px); margin: 5px; min-height: 40px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums;
}
.pilze td button.pow small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.pilze td button.pow:hover { border-color: var(--accent); }
.pilze td button.pow[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border-color: var(--accent); }
.squad-wrap h3 { font-family: var(--display); font-size: 20px; margin: 22px 2px 10px; }
.squad-wrap h3 small { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); }
.squad { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; counter-reset: sq; }
.squad li {
  counter-increment: sq; display: grid; grid-template-columns: 22px 52px 1fr auto auto; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 6px 8px;
}
.squad li::before { content: counter(sq); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mini { position: relative; width: 52px; aspect-ratio: 160 / 133; border-radius: 8px; overflow: hidden; background: color-mix(in srgb, var(--c) 17%, #F7F9F5); }
.mini i { position: absolute; inset: 0; background-image: url("thumbs.jpg"); background-repeat: no-repeat; mix-blend-mode: multiply; }
.sq-name { font-weight: 600; font-size: 13px; line-height: 1.25; min-width: 0; }
.sq-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.sq-calc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sq-pow { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .sq-calc { display: none; } .squad li { grid-template-columns: 22px 52px 1fr auto; } }
.matrix-sum { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 0 2px 14px; }
.matrix-sum div { display: grid; }
.matrix-sum dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.matrix-sum dd { margin: 0; font-family: var(--display); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.matrix-sum .points dd { display: flex; align-items: baseline; gap: 8px; }
.matrix-sum .points small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
#points-btn {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px;
}
.matrix tfoot th, .matrix tfoot td { border-top: 2px solid var(--line); border-bottom: 0; }
.matrix tfoot th { text-align: left; padding: 10px 14px; font-weight: 700; }
.matrix tfoot th small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.matrix-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 2px 0; font-size: 13px; color: var(--muted); list-style: none; padding: 0; }
.matrix-legend li { display: flex; align-items: center; gap: 4px; }
.matrix tbody tr.cat th {
  padding: 16px 14px 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.matrix tbody th small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.matrix td button {
  width: 100%; min-height: 42px; border: 0; background: none; cursor: pointer; font-weight: 600;
}
.matrix td button.has { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.matrix td button.has:hover { background: color-mix(in srgb, var(--c) 42%, var(--surface)); }
.matrix td button.none { color: var(--line); cursor: default; }
.matrix td button.cand {
  width: calc(100% - 10px); min-height: 32px; margin: 5px; border-radius: 8px;
  border: 2px dashed color-mix(in srgb, var(--c) 70%, var(--ink)); color: var(--ink); font-size: 13px;
}
.matrix td button.cand:hover { background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.matrix td.total.open { color: var(--accent); }
.matrix td .na { display: block; min-height: 42px; line-height: 42px; color: var(--muted); background: var(--surface-2); }
.matrix td.total { font-weight: 700; padding: 0 14px; color: var(--muted); }
.matrix-note { margin: 12px 2px 0; font-size: 13px; color: var(--muted); }

@media (max-width: 600px) {
  .shown { margin-left: 0; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .name { font-size: 15px; }
}
.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 6px 18px; flex-wrap: wrap; }
.foot a { color: var(--muted); }
.foot a:hover { color: var(--accent); }
.legal { max-width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 28px 32px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); }
.legal::backdrop { background: rgb(0 0 0 / .45); }
.legal-close { position: sticky; top: 0; float: right; margin: -12px -16px 0 12px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--surface-2); cursor: pointer; font-size: 20px; line-height: 1; }
.legal-body h2 { font-family: var(--display); margin: 0 0 14px; }
.legal-body h3 { font-size: 15px; margin: 20px 0 6px; }
.legal-body p { margin: 0 0 10px; }
.legal-body a { color: var(--accent); }
@media (max-width: 600px) { .legal { padding: 22px 18px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.mast-side { display: grid; justify-items: end; gap: 10px; }
.lang { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; padding: 2px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
</style>

<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div>
        <p class="eyebrow">Pikmin Bloom · <span data-t="asOf"></span> <span id="stand"></span></p>
        <h1 data-t="title"></h1>
      </div>
      <div class="mast-side">
        <div class="lang" id="lang" role="group" aria-label="Sprache / Language">
          <button type="button" data-lang="de" lang="de">DE</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <div class="count"><b id="total">0</b><span data-t="count"></span></div>
      </div>
    </div>
    <div>
      <div class="spectrum" id="spectrum" data-t-aria="spectrum"></div>
      <ul class="legend" id="legend"></ul>
    </div>
    <dl class="stats" id="stats"></dl>
    <p class="note" id="note"></p>
  </header>

  <nav class="bar" data-t-aria="nav">
    <div class="bar-inner">
      <div class="tabs" role="tablist">
        <button id="tab-grid" role="tab" aria-selected="true" data-t="tabGrid"></button>
        <button id="tab-matrix" role="tab" aria-selected="false" data-t="tabMatrix"></button>
        <button id="tab-pilze" role="tab" aria-selected="false" data-t="tabPilze"></button>
        <button id="tab-keime" role="tab" aria-selected="false" data-t="tabKeime" hidden></button>
      </div>
      <label class="search"><input id="q" type="search" data-t-ph="searchPh" data-t-aria="search"></label>
      <select id="decor" data-t-aria="decorSel"></select>
      <select id="sort" data-t-aria="sortSel">
        <option value="rank" data-t="sortRank"></option>
        <option value="steps" data-t="sortSteps"></option>
        <option value="new" data-t="sortNew"></option>
        <option value="old" data-t="sortOld"></option>
        <option value="name" data-t="sortName"></option>
      </select>
      <button class="chip fav-toggle" id="fav" aria-pressed="false" data-t="favs"></button>
      <div class="chips" id="colors"></div>
      <span class="shown" id="shown"></span>

  return (NAMES_EN.decor[base] || base) + (rare ? " (Rare)" : "") + (motif ? " · " + (MOTIF_EN[motif] || motif) : "");

/* ---- static texts and language switch ---- */
function texts() {
  document.documentElement.lang = L;
  document.title = T.title;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[e.dataset.t]; });
  document.querySelectorAll("[data-t-html]").forEach(e => { e.innerHTML = T[e.dataset.tHtml]; });
  document.querySelectorAll("[data-t-aria]").forEach(e => e.setAttribute("aria-label", T[e.dataset.tAria]));
  document.querySelectorAll("[data-t-ph]").forEach(e => e.setAttribute("placeholder", T[e.dataset.tPh]));
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $("lang").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.dataset.lang === L) return;
    try { localStorage.setItem(LANG_KEY, b.dataset.lang); } catch (err) { /* no storage: the URL keeps it */ }
    const url = new URL(location.href);
    url.searchParams.set("lang", b.dataset.lang);
    location.replace(url);
  });
}

/* ---- legal notice / privacy policy: the owner's own texts from legal/ (see legal/*.example*.html) ---- */
const LEGAL = DATA.legal || {};
const LEGAL_HASH = { imprint: ["impressum", "imprint"], privacy: ["datenschutz", "privacy"] };
function openLegal(name) {
  const texts = LEGAL[name]; if (!texts) return;
  $("legal-body").innerHTML = texts[L] || texts.de || texts.en;  // the owner's own HTML
  if (!$("legal").open) $("legal").showModal();
}
function legalPages() {
  const names = Object.keys(LEGAL).filter(n => LEGAL_HASH[n]);
  if (!names.length) return;
  $("foot").hidden = false;
  $("foot").innerHTML = names.map(n => `<a href="#${LEGAL_HASH[n][L === "de" ? 0 : 1]}" data-legal="${n}">${T[n]}</a>`).join("");
  $("foot").addEventListener("click", e => {
    const a = e.target.closest("[data-legal]"); if (!a) return;
    e.preventDefault();
    history.replaceState(null, "", a.getAttribute("href"));
    openLegal(a.dataset.legal);
  });
  $("legal").addEventListener("click", e => { if (e.target === $("legal")) $("legal").close(); });  // backdrop
  $("legal").addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));
  const fromHash = () => {
    const h = location.hash.slice(1).toLowerCase();
    const name = names.find(n => LEGAL_HASH[n].includes(h));
    if (name) openLegal(name);
  };
  window.addEventListener("hashchange", fromHash);
  fromHash();  // links like …/#impressum open the text directly
}

/* ---- grid ---- */
const HEART = "M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z";
let hid = 0;
function hearts(p) {
  let out = "";
  for (let i = 0; i < 4; i++) {
    const fill = Math.max(0, Math.min(1, p.hearts - i));
    const col = p.gold && i === 0 ? "var(--gold)" : "var(--bloom)";
    const id = "h" + (hid++);
    out += `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="${id}"><rect x="0" y="0" width="${24 * fill}" height="24"/></clipPath></defs>` +
      `<path d="${HEART}" fill="var(--heart-empty)"/><path d="${HEART}" fill="${col}" clip-path="url(#${id})"/></svg>`;
  }
  const label = p.gold ? T.heartsGold : T.heartsOf(p.hearts);
  return `<span class="hearts" title="${label}" aria-label="${label}">${out}</span>`;
}
function sprite(p) {
  const i = p.frame - 1, col = i % S.cols, row = Math.floor(i / S.cols);
  const x = S.cols > 1 ? (col / (S.cols - 1)) * 100 : 0;
  const y = S.rows > 1 ? (row / (S.rows - 1)) * 100 : 0;
  return `background-size:${S.cols * 100}% ${S.rows * 100}%;background-position:${x}% ${y}%`;
}
function card(p) {
  const decorTag = p.decor
    ? `<span class="tag decor">${esc(tDecor(p.decor))}</span>`
    : `<span class="tag plain">${T.plain}</span>`;
  return `<article class="card">
    <div class="portrait" style="--c:${cvar[p.color]}">
      <i style="${sprite(p)}"></i>
      <span class="rank">#${p.rank}</span>
      ${p.fav ? `<span class="star" title="${T.fav}">★</span>` : ""}
    </div>
    <div class="body">
      <h2 class="name">${esc(pname(p))}</h2>
      <div class="meta"><span class="tag"><span class="dot" style="--c:${cvar[p.color]}"></span>${tColor(p.color)}</span>${decorTag}</div>
      <div class="row">${hearts(p)}<span class="steps">${fmt(p.steps)} ${T.steps}</span></div>
      <div class="where">${p.location ? `<span>${esc(tLoc(p.location))}</span>` : ""}<span>${esc(tSpot(p.spot))} · ${T.found(showDate(p.date))}</span></div>
    </div>
  </article>`;
}
// searchable in both languages: the German game names and the ones shown on the page
const haystack = p => [p.name, pname(p), p.origin, p.location, tLoc(p.location), p.decor, tDecor(p.decor),
  p.spot, tSpot(p.spot), p.color, tColor(p.color)].join(" ").toLowerCase();
function filtered() {
  const q = state.q;
  let list = state.points ? pointCandidates()
    : state.cand ? candidates(state.cand.decor, state.cand.color) : P.filter(p =>
    (!state.colors.size || state.colors.has(p.color)) &&
    (!state.fav || p.fav) &&
    (state.decor === "" || (state.decor === "*" ? p.decor : state.decor === "-" ? !p.decor : p.decor === state.decor)) &&
    (!q || haystack(p).includes(q)));
  const cmp = {
    rank: (a, b) => a.rank - b.rank,
    steps: (a, b) => b.steps - a.steps,
    new: (a, b) => b.date.localeCompare(a.date) || a.rank - b.rank,
    old: (a, b) => a.date.localeCompare(b.date) || a.rank - b.rank,
    name: (a, b) => pname(a).localeCompare(pname(b), L) || a.rank - b.rank
  }[state.sort];
  return list.sort(cmp);
}

/* ---- matrix ---- */
// Pikmin without decor whose discovery spot offers decor k in color n
// rare decor only ever upgrades an existing Pikmin carrying the base decor
const baseOf = k => k.endsWith(RARE) ? k.slice(0, -RARE.length) : null;
const noEis = k => baseOf(k) ? NO_EIS.has(baseOf(k)) || RARE_NO_EIS.has(baseOf(k)) : NO_EIS.has(k);
// false = this colour does not exist for the decor in-game
const available = (k, n) => {
  const only = ONLY_COLORS[baseOf(k) || k.split(" · ")[0]];
  return only ? only.includes(n) : !(n === "Eis" && noEis(k));
};
// rare sets unlocked in the in-game collection (config.local.json "rare_unlocked")
const RARE_UNLOCKED = (DATA.config && DATA.config.rareUnlocked) || [];
// normal decor with a rare variant (pikminwiki.com/Decor_Pikmin, Sep 2026)
const RARE_EXISTS = new Set(["Kochmütze", "Kaffeetasse", "Zahnpflege", "Hirschkäfer", "Eichelhut", "Köder",
  "Ticket", "Banane", "Baguette", "Schere", "Vierblättriger Klee", "Ball-Schlüsselanhänger", "Münze"]);
function rareBadge(k, names) {
  if (baseOf(k)) return { cls: "rare", html: `<span class="rare-badge rare" title="${T.rareTitle}">${T.rare}</span>` };
  if (RARE_EXISTS.has(k) || names.has(k + RARE))
    return { cls: "has-rare", html: `<span class="rare-badge has" title="${T.hasRareTitle}">✦</span>` };
  return { cls: "", html: "" };
}
// places whose rare decor level is unlocked (their rare sets show up in the collection)
function rareSpots() {
  return new Set(RARE_UNLOCKED
    .map(k => (P.find(p => p.decor === k || p.decor === baseOf(k) || p.spotDecor === baseOf(k)) || {}).spot)
    .filter(Boolean));
}
const rareSpotNames = () => [...rareSpots()].map(tSpot).join(", ");
// Pikmin without decor from those places: reaching L4 gives their decor and 200 decor points
const pointCandidates = () => { const spots = rareSpots(); return P.filter(p => !p.decor && spots.has(p.spot)); };
const candidates = (k, n) => baseOf(k)
  ? P.filter(p => p.decor === baseOf(k) && p.color === n)
  : P.filter(p => !p.decor && p.spotDecor === k && p.color === n);
function matrix() {
  const decor = P.filter(p => p.decor);
  const names = new Set([...decor.map(p => p.decor), ...P.filter(p => !p.decor && p.spotDecor).map(p => p.spotDecor), ...RARE_UNLOCKED]);
  const rows = [...names].map(k => {
    const list = decor.filter(p => p.decor === k);
    const spot = (list[0] || P.find(p => p.spotDecor === k || (baseOf(k) && p.decor === baseOf(k)))).spot;
    const open = COLORS.filter(([n]) => available(k, n) && !list.some(p => p.color === n)
        && !((m => m.length && m.every(x => decor.some(p => p.decor === x && p.color === n)))(
          [...new Set(decor.filter(p => p.motif && p.decor.startsWith(k + " · ")).map(p => p.decor))])))
      .filter(([n]) => candidates(k, n).length).length;
    return { k, list, spot, open };
  });
  // order of the in-game decor collection: places as listed there, sets within a place in the
  // order of the decor-sorted Pikmin list, rare sets before the normal ones
  const ORDER = DATA.order || { spots: [], sets: [] };
  const spotRank = s => { const i = ORDER.spots.indexOf(s); return i < 0 ? 900 : i; };
  const setRank = k => { const base = baseOf(k); const i = ORDER.sets.indexOf(base || k); return (i < 0 ? 500 : i) - (base ? 1000 : 0); };
  rows.sort((a, b) => spotRank(a.spot) - spotRank(b.spot) || a.spot.localeCompare(b.spot, "de")
    || setRank(a.k) - setRank(b.k) || a.k.localeCompare(b.k, "de"));
  const head = `<thead><tr><th scope="col" style="text-align:left;padding-left:14px">${T.mDecor}</th>` +
    COLORS.map(([n]) => `<th scope="col"><span class="dot" style="--c:${cvar[n]}"></span>${tColor(n)}</th>`).join("") +
    `<th scope="col">Σ</th><th scope="col" title="${T.mCandTitle}">${T.mCand}</th></tr></thead>`;
  // a decor split into motifs: its plain row only collects candidates (the motif of a future
  // Pikmin is unknown), so a colour counts as done when every motif already has it
  const motifRows = k => rows.filter(r => r.list.length && r.list[0].motif && r.k.startsWith(k + " · "));
  const allMotifsHave = (k, n) => { const m = motifRows(k); return m.length && m.every(r => r.list.some(p => p.color === n)); };
  const body = rows.map(({ k, list, spot, open }, i) => {
    const place = i === 0 || rows[i - 1].spot !== spot ? `<tr class="cat"><th colspan="11" scope="rowgroup">${esc(tSpot(spot))}</th></tr>` : "";
    const slots = COLORS.filter(([n]) => available(k, n)).length;
    const split = motifRows(k).length > 0;
    const kt = esc(tDecor(k));
    const cells = COLORS.map(([n]) => {
      if (!available(k, n)) return `<td><span class="na" title="${T.naTitle}">–</span></td>`;
      if (split && allMotifsHave(k, n)) return `<td><span class="na" title="${T.allMotifs}">✓</span></td>`;
      const c = list.filter(p => p.color === n).length;
      if (c) return `<td><button class="has" style="--c:${cvar[n]}" data-decor="${esc(k)}" data-color="${n}" aria-label="${kt} ${tColor(n)}: ${c}">${c}</button></td>`;
      const cand = candidates(k, n).length;
      return cand
        ? `<td><button class="cand" style="--c:${cvar[n]}" data-decor="${esc(k)}" data-color="${n}" title="${T.candTitle(cand)}" aria-label="${T.candAria(kt, tColor(n), cand)}">○${cand > 1 ? cand : ""}</button></td>`
        : `<td><button class="none" disabled aria-label="${T.noneAria(kt, tColor(n))}">·</button></td>`;
    }).join("");
    const have = COLORS.filter(([n]) => list.some(p => p.color === n)).length;
    const sub = split ? T.subSplit : T.subHave(have, slots);
    const badge = rareBadge(k, names);
    return place + `<tr class="${badge.cls}"><th scope="row">${kt}${badge.html}<small>${sub}</small></th>${cells}` +
      `<td class="total">${list.length}</td><td class="total${open ? " open" : ""}">${open || "–"}</td></tr>`;
  }).join("");
  // open candidates = missing colours for which a fitting Pikmin already exists (column "Kandidaten")
  const sum = list => list.reduce((s, r) => s + r.open, 0);
  const openRare = sum(rows.filter(r => baseOf(r.k)));
  const openNormal = sum(rows.filter(r => !baseOf(r.k)));
  const decorTotal = rows.reduce((s, r) => s + r.list.length, 0);
  const foot = `<tfoot><tr><th scope="row">${T.sum}<small>${T.sumSub}</small></th>` +
    `<td colspan="8"></td><td class="total">${decorTotal}</td><td class="total open">${openNormal + openRare}</td></tr></tfoot>`;
  $("matrix").innerHTML = head + `<tbody>${body}</tbody>` + foot;
  const pts = pointCandidates().length;
  $("matrix-sum").innerHTML = [
    [T.openNormal, openNormal],
    [T.openRare, openRare],
    [T.openAll, openNormal + openRare]
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("") +
    `<div class="points"><dt>${T.points}</dt><dd><button id="points-btn" type="button" ` +
    `title="${T.pointsTitle}">${pts}</button>` +
    `<small>${esc(rareSpotNames() || T.noPlaces)} · ${T.perPoints(fmt(pts * 200))}</small></dd></div>`;
}

function render() {
  const list = filtered();
  const active = state.q || state.colors.size || state.decor || state.fav || state.cand || state.points;
  const label = state.points
    ? T.pointsLabel(list.length, esc(rareSpotNames()))
    : state.cand
    ? T.candLabel(list.length, esc(tDecor(state.cand.decor)), tColor(state.cand.color))
    : T.ofTotal(list.length, P.length);
  $("shown").innerHTML = label + (active ? ` <button class="reset">${T.reset}</button>` : "");
  if (state.view === "grid") {
    hid = 0;
    $("grid").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">${state.points ? T.emptyPoints : T.empty}</p>`;
  }
}

/* ---- Pilzkampf: pikminwiki.com/Mushroom_battle, attack power since 14 Dec 2022 ---- */
const BASE = { Rot: 4, Gelb: 3, Blau: 3, Lila: 6, Weiß: 2, Flügel: 2, Fels: 5, Eis: 2 };
const HEADS = [0, 1, 3, 4, 5].map((v, i) => [T.heads[i], v]);
const MUSHROOMS = [
  "var(--c-rot)", "var(--c-gelb)", "var(--c-blau)", "var(--c-lila)", "var(--c-weiss)", "var(--c-fluegel)",
  "var(--c-fels)", "var(--c-eis)", "#F07A2C", "#F2C230", "#3E7BE0", "#8A4FD0", "#9FD4E6", "var(--accent)"
].map((c, i) => [T.mushrooms[i], c]);
// matchup bonus, rows = attacking Pikmin exactly as in the wiki table, columns = MUSHROOMS;
// null = this colour cannot attack the (elemental) mushroom
const X = null;
const MATCH = {
  Rot:    [12, 3, 0, 3, 0, 3, 0, 3, 100, X, X, X, X, 0],
  Gelb:   [3, 12, 0, 3, 0, 3, 3, 3, X, 100, X, X, X, 0],
  Blau:   [0, 3, 12, 3, 0, 3, 3, 3, X, X, 100, X, X, 0],
  Lila:   [3, 3, 0, 12, 0, 3, 3, 3, X, X, X, X, X, 0],
  Weiß:   [3, 3, 0, 3, 12, 3, 0, 3, X, X, X, 100, X, 0],
  Flügel: [3, 3, 3, 3, 0, 12, 0, 3, X, X, X, X, X, 0],
  Fels:   [3, 3, 0, 3, 0, 3, 12, 3, X, X, X, X, 100, 0],
  Eis:    [0, 3, 3, 3, 0, 3, 3, 12, X, X, X, X, X, 0]
};
const SQUAD = 40;
const friendPoints = p => p.goldHearts > 0 ? [0, 8, 12, 16, 20][Math.min(4, p.goldHearts)] : Math.floor(p.hearts);
// Decor Pikmin events: primary decor +300 / secondary +100 on the event mushroom, +15 on all others.
// Which decor is primary/secondary changes per event -> chosen on the page, kept in this browser.
const EVENT_KEY = "pikmin-event-decor";
const EVENT_MI = MUSHROOMS.length - 1;
let EVENT = { primary: [], secondary: [] };
try { EVENT = { ...EVENT, ...JSON.parse(localStorage.getItem(EVENT_KEY) || "{}") }; } catch (e) { /* no storage */ }
const decorBase = p => { if (!p.decor) return null; const d = p.decor.split(" · ")[0]; return baseOf(d) || d; };
function eventBonus(p, mi) {
  const b = decorBase(p);
  if (!b) return 0;
  if (EVENT.primary.includes(b)) return mi === EVENT_MI ? 300 : 15;
  if (EVENT.secondary.includes(b)) return mi === EVENT_MI ? 100 : 15;
  return 0;
}
function power(p, mi, head) {
  const m = MATCH[p.color] ? MATCH[p.color][mi] : null;
  return m === null ? null : BASE[p.color] + (p.decor ? 4 : 0) + head + friendPoints(p) + m + eventBonus(p, mi);
}
function renderEvent() {
  const bases = [...new Set(P.map(decorBase).filter(Boolean))];
  const rank = b => { const i = (DATA.order?.sets || []).findIndex(s => s === b || s.startsWith(b + " · ")); return i < 0 ? 999 : i; };
  bases.sort((a, b) => rank(a) - rank(b) || tDecor(a).localeCompare(tDecor(b), L));
  const role = b => EVENT.primary.includes(b) ? "primary" : EVENT.secondary.includes(b) ? "secondary" : "";
  const active = EVENT.primary.length + EVENT.secondary.length;
  $("event-cfg").innerHTML = `<div class="event-head"><strong>${T.eventTitle}</strong>
      <span>${active ? T.eventActive(EVENT.primary.length, EVENT.secondary.length) : T.eventNone}</span>
      ${active ? `<button type="button" class="reset" data-reset="1">${T.reset}</button>` : ""}</div>
    <p>${T.eventHelp}</p>
    <div class="event-chips">${bases.map(b => `<button type="button" class="ev-chip ${role(b)}" data-decor="${esc(b)}">${esc(tDecor(b))}</button>`).join("")}</div>`;
}
function saveEvent() {
  try { localStorage.setItem(EVENT_KEY, JSON.stringify(EVENT)); } catch (e) { /* no storage */ }
  renderEvent();
  pilze();
  if (lastSquad) showSquad(...lastSquad, false);
}
let lastSquad = null;
$("event-cfg").addEventListener("click", e => {
  if (e.target.closest("[data-reset]")) { EVENT = { primary: [], secondary: [] }; return saveEvent(); }
  const b = e.target.closest(".ev-chip"); if (!b) return;
  const d = b.dataset.decor;
  if (EVENT.primary.includes(d)) {
    EVENT.primary = EVENT.primary.filter(x => x !== d); EVENT.secondary.push(d);
  } else if (EVENT.secondary.includes(d)) {
    EVENT.secondary = EVENT.secondary.filter(x => x !== d);
  } else {
    EVENT.primary.push(d);
  }
  saveEvent();
});
function squad(mi, head) {
  return P.map(p => ({ p, v: power(p, mi, head) })).filter(x => x.v !== null)
    .sort((a, b) => b.v - a.v || b.p.steps - a.p.steps).slice(0, SQUAD);

        `${s.length < SQUAD ? `<small>${T.nPikmin(s.length)}</small>` : ""}</button></td>`;

      <span class="sq-calc" title="${T.calcTitle(eventBonus(p, mi))}">${BASE[p.color]} + ${p.decor ? 4 : 0} + ${hv} + ${friendPoints(p)} + ${MATCH[p.color][mi]}${eventBonus(p, mi) ? ` + <b class="ev ${EVENT.primary.includes(decorBase(p)) ? "primary" : "secondary"}">${eventBonus(p, mi)}</b>` : ""}</span>
      <span class="sq-pow">${v}</span></li>`).join("") + `</ol>`;
  if (scroll) $("squad").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("pilze").addEventListener("click", e => {
  const b = e.target.closest("button.pow"); if (!b) return;
  showSquad(+b.dataset.m, +b.dataset.h);
});
renderEvent();
pilze();

/* ---- Keime: which seedlings to plant before the rare decor of their category is unlocked ---- */
const SEEDS = (DATA.seeds && DATA.seeds.list) || [];
const SPECIAL_POINTS = { Riesen: 200 };  // pikminwiki.com/Decor_Pikmin: plucking a Huge Seedling
const hasDecor = (k, n) => P.some(p => p.decor === k && p.color === n);
function seedAdvice() {
  const spots = rareSpots(), claimed = new Set(), out = new Map();
  // seedlings already growing come anyway: they claim their missing type first
  for (const s of [...SEEDS].sort((a, b) => b.planted - a.planted || a.n - b.n)) {
    const unlocked = spots.has(s.spot), opts = s.options;
    let act, why;
    if (!opts.length) {
      act = "wait"; why = T.seedUnknown;
    } else if (s.kind === "special") {
      const pts = SPECIAL_POINTS[s.color] || 0;
      const types = [...new Set(opts.flatMap(k => COLORS.filter(([n]) => available(k, n)).map(([n]) => n)))];
      const missing = types.filter(n => opts.some(k => available(k, n) && !hasDecor(k, n)));
      if (unlocked) { act = "hatch"; why = T.hugeUnlocked(pts); }
      else if (missing.length) { act = "hatch"; why = T.hugeChance(missing.length, types.length); }
      else { act = "wait"; why = T.hugeWait(pts); }
    } else {
      const slot = k => k + "|" + s.color;
      const open = opts.filter(k => available(k, s.color) && !hasDecor(k, s.color)
        && !candidates(k, s.color).length && !claimed.has(slot(k)));
      const names = list => list.map(k => L === "en" ? `${tColor(s.color)} ${tDecor(k)}` : `${tDecor(k)} ${tColor(s.color)}`).join(", ");
      if (open.length && open.length === opts.length) {
        act = "hatch"; why = T.seedMissing(names(open)) + (unlocked ? " · +30" : "");
        open.forEach(k => claimed.add(slot(k)));
      } else if (open.length) {
        act = "maybe"; why = T.seedMaybe(names(open));
      } else if (unlocked) {
        act = "hatch"; why = T.seedPoints;
      } else {
        const k = opts[0], label = names([k]), cand = candidates(k, s.color)[0];
        act = "wait";
        why = opts.length > 1 ? T.seedHave(names(opts)) : hasDecor(k, s.color) ? T.seedHave(label)
          : cand ? T.seedCand(label, cand.rank) : T.seedClaimed(label);
      }
    }
    out.set(s.n, { act: s.planted ? "planted" : act, why });
  }
  return out;
}
function seedsView() {
  if (!SEEDS.length) return;
  $("tab-keime").hidden = false;
  const advice = seedAdvice();
  $("seeds-intro").textContent = T.seedsIntro(showDate(DATA.seeds.scan));
  const groups = ["hatch", "maybe", "wait", "planted"];
  const inGroup = g => SEEDS.filter(s => advice.get(s.n).act === g);
  const waiting = inGroup("wait");
  const points = waiting.reduce((a, s) => a + (s.kind === "special" ? SPECIAL_POINTS[s.color] || 0 : 30), 0);
  $("seeds-sum").innerHTML = [inGroup("hatch").length, inGroup("maybe").length, waiting.length, fmt(points)]
    .map((v, i) => `<div><dt>${T.seedSum[i]}</dt><dd>${v}</dd></div>`).join("");
  const dot = s => s.kind === "special" ? "var(--gold)" : cvar[s.color];
  $("seeds").innerHTML = groups.map(g => {
    const list = inGroup(g);
    if (!list.length) return "";
    return `<div class="seed-group"><h3>${T.seedGroups[g]} <small>${list.length} · ${T.seedGroupSub[g]}</small></h3><ul class="seed-list">` +
      list.map(s => `<li class="${s.kind}"><span class="dot" style="--c:${dot(s)}"></span>
        <span class="seed-name">${esc(T.seedName(s.color))} · ${esc(s.options.map(tDecor).join(" / ") || tSpot(s.spot))}
          <small>${[tSpot(s.spot), tLoc(s.location)].filter(Boolean).map(esc).join(" · ")} · ${showDate(s.date)}</small></span>
        <span class="seed-grow">${T.grow(s.growHave === null ? null : fmt(s.growHave), fmt(s.growNeed || 0))}</span>
        <span class="seed-why ${advice.get(s.n).act}">${esc(advice.get(s.n).why)}</span></li>`).join("") + `</ul></div>`;
  }).join("");
}
seedsView();

$("matrix-sum").addEventListener("click", e => {
  if (!e.target.closest("#points-btn")) return;
  resetFilters();
  state.points = true;
  setView("grid");
  window.scrollTo({ top: $("view-grid").offsetTop - 80, behavior: "smooth" });
});
$("matrix").addEventListener("click", e => {
  const b = e.target.closest("button.has, button.cand"); if (!b) return;
  resetFilters();
  if (b.classList.contains("cand")) {
    state.cand = { decor: b.dataset.decor, color: b.dataset.color };
  } else {
    state.decor = b.dataset.decor; $("decor").value = b.dataset.decor;
    state.colors = new Set([b.dataset.color]); syncChips();
  }
  setView("grid");
  window.scrollTo({ top: $("view-grid").offsetTop - 80, behavior: "smooth" });
});
render();
</script>
